<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Pecking Order v0.4</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #111;
            overscroll-behavior: none;
            touch-action: none; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            width: 720,  
            height: 1280, 
            backgroundColor: '#1e1e24',
            pixelArt: true, 
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 3500 }, 
                    debug: false
                }
            },
            scene: {
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);

        let player, desk, obstacles, rooster;
        let isFlipped = false;
        let gameSpeed = 450; 
        let score = 0;
        let isGameOver = false;
        let spawnTimer;

        let uiLayer, scoreText, gameOverPanel, finalScoreText;

        function create() {
            // ==========================================
            // FOOLPROOF TEXTURE GENERATION
            // Paints the assets directly into memory
            // ==========================================
            const g = this.make.graphics({ x: 0, y: 0, add: false });

            // 1. Draw Desk Tile (32x32)
            g.fillStyle(0x8c9298, 1);
            g.fillRect(0, 0, 32, 32);
            g.fillStyle(0x555c62, 1);
            g.fillRect(0, 14, 32, 4); // Edge detail
            g.generateTexture('desk', 32, 32);
            g.clear();

            // 2. Draw Worker (16x16)
            g.fillStyle(0xffcc99, 1); // Head
            g.fillRect(4, 2, 8, 6);
            g.fillStyle(0x1a365b, 1); // Suit
            g.fillRect(3, 8, 10, 8);
            g.fillStyle(0xffd000, 1); // Tie
            g.fillRect(7, 8, 2, 4);
            g.generateTexture('worker', 16, 16);
            g.clear();

            // 3. Draw Stapler (24x24)
            g.fillStyle(0x555c62, 1); // Base
            g.fillRect(2, 16, 20, 4);
            g.fillStyle(0xbbbbbb, 1); // Top
            g.fillTriangle(2, 16, 22, 6, 22, 16);
            g.generateTexture('stapler', 24, 24);
            g.clear();

            // 4. Draw Executive Rooster (64x64)
            g.fillStyle(0xffffff, 1); // Body
            g.fillCircle(32, 32, 24);
            g.fillStyle(0xff0000, 1); // Comb
            g.fillTriangle(32, 8, 24, 0, 40, 0);
            g.fillStyle(0x00ff00, 1); // Glowing Eye
            g.fillCircle(20, 24, 6);
            g.fillStyle(0x000000, 1); // Pupil
            g.fillCircle(20, 24, 2);
            g.fillStyle(0x999999, 1); // Beak
            g.fillTriangle(8, 32, 16, 37, 8, 42);
            g.generateTexture('rooster', 64, 64);
            g.clear();

            // ==========================================
            // GAME SETUP
            // ==========================================
            const centerX = this.cameras.main.width / 2;
            const centerY = this.cameras.main.height / 2;

            // Background Rooster
            rooster = this.add.image(centerX, centerY - 300, 'rooster').setScale(8);
            rooster.setAlpha(0.15);
            this.tweens.add({
                targets: rooster, scaleY: 8.5, scaleX: 7.8, duration: 2500, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
            });

            // The Desk
            desk = this.add.tileSprite(centerX, centerY, 1440, 64, 'desk').setScale(1.5);
            this.physics.add.existing(desk, true);

            // The Player
            player = this.physics.add.sprite(150, centerY - 150, 'worker').setScale(4.5);
            player.body.setSize(10, 14); 
            player.setCollideWorldBounds(true);
            this.physics.add.collider(player, desk);

            // Obstacles
            obstacles = this.physics.add.group();
            this.physics.add.overlap(player, obstacles, triggerGameOver, null, this);

            // In-Game UI
            scoreText = this.add.text(centerX, 150, 'MINUTES SAVED: 0', { 
                fontFamily: 'monospace', fontSize: '48px', color: '#00ff00', fontStyle: 'bold' 
            }).setOrigin(0.5);

            const instructionText = this.add.text(centerX, 220, 'TAP TO PIVOT', { 
                fontFamily: 'monospace', fontSize: '28px', color: '#ffffff', alpha: 0.5 
            }).setOrigin(0.5);

            // Game Over Panel
            gameOverPanel = this.add.container(centerX, centerY).setDepth(100).setVisible(false);
            const bg = this.add.rectangle(0, 0, 650, 450, 0x000000, 0.95).setStrokeStyle(4, 0xff0000);
            const title = this.add.text(0, -140, 'REDUNDANT!', { fontFamily: 'monospace', fontSize: '64px', color: '#ff0000', fontStyle: 'bold' }).setOrigin(0.5);
            finalScoreText = this.add.text(0, -20, '', { fontFamily: 'monospace', fontSize: '32px', color: '#ffffff', align: 'center' }).setOrigin(0.5);
            const restartBtn = this.add.text(0, 120, '> TAP TO REAPPLY <', { fontFamily: 'monospace', fontSize: '40px', color: '#00ff00' }).setOrigin(0.5);
            
            this.tweens.add({ targets: restartBtn, alpha: 0, duration: 500, yoyo: true, repeat: -1 });
            gameOverPanel.add([bg, title, finalScoreText, restartBtn]);

            // Input Handler
            this.input.on('pointerdown', handleInput, this);

            // Spawner
            spawnTimer = this.time.addEvent({ delay: 1000, callback: spawnObstacle, callbackScope: this, loop: true });
        }

        function handleInput() {
            if (isGameOver) { restartGame.call(this); return; }

            isFlipped = !isFlipped;
            player.setFlipY(isFlipped);
            
            if (isFlipped) {
                this.physics.world.gravity.y = -3500;
                player.setVelocityY(-400); 
            } else {
                this.physics.world.gravity.y = 3500;
                player.setVelocityY(400);
            }
        }

        function spawnObstacle() {
            if (isGameOver) return;

            const isTop = Math.random() > 0.5;
            const centerY = this.cameras.main.height / 2;
            const yPos = isTop ? centerY - 85 : centerY + 85; 

            const obstacle = obstacles.create(850, yPos, 'stapler').setScale(3);
            obstacle.body.setSize(20, 16); 
            
            if (!isTop) obstacle.setFlipY(true);

            obstacle.setVelocityX(-gameSpeed);
            obstacle.setImmovable(true);
            obstacle.body.allowGravity = false;

            gameSpeed += 5;
            spawnTimer.delay = Math.max(500, spawnTimer.delay - 10);
        }

        function update() {
            if (isGameOver) return;

            desk.tilePositionX += (gameSpeed * 0.015);
            score += 0.05;
            scoreText.setText(`MINUTES SAVED: ${Math.floor(score)}`);

            obstacles.getChildren().forEach(obs => {
                if (obs.x < -100) obs.destroy();
            });
        }

        function triggerGameOver() {
            if (isGameOver) return; 
            isGameOver = true;
            this.physics.pause();
            
            player.setTint(0xff0000);
            this.cameras.main.shake(200, 0.015);

            finalScoreText.setText(`You saved ${Math.floor(score)} minutes.\n\nYour position has been\ngiven to Jane Doe.`);
            gameOverPanel.setVisible(true);
            
            this.time.delayedCall(500, () => { this.input.once('pointerdown', restartGame, this); });
        }

        function restartGame() {
            isGameOver = false;
            score = 0;
            gameSpeed = 450;
            isFlipped = false;
            this.physics.world.gravity.y = 3500;
            this.scene.restart();
        }
    </script>
</body>
</html>
