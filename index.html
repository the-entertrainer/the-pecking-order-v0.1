<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=portrait">
    <title>Out of Office: The Daily Sync</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e0e0e0; /* Gray backdrop for the phone */
            color: #242424;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #gameWrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 450px;
            max-height: 850px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
            background-color: #ffffff;
        }
        #gameCanvas {
            background-color: #ffffff; /* Teams Light Mode */
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

<div id="gameWrapper">
    <canvas id="gameCanvas" width="450" height="800"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ── HIGH-DPI SETUP FOR SHARP GRAPHICS ──
    const logicalWidth = 450;
    const logicalHeight = 800;
    const DPR = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = logicalWidth * DPR;
    canvas.height = logicalHeight * DPR;
    ctx.scale(DPR, DPR);

    // --- GAME STATE ---
    let frames = 0;
    let daysEscaped = 0;
    let chickenEscapes = 0;
    let currentGameState = 'START'; 
    let baseSpeed = 4;
    let currentScrollSpeed = baseSpeed;
    let screenShake = 0;

    // --- PROCEDURAL GENERATORS ---
    const titlePrefixes = ["Quick", "Mandatory", "Optional", "Urgent", "Daily", "Weekly", "Q3", "Strategic", "Tactical", "Deep Dive", "Touchbase", "Synergy", "Post-Mortem"];
    const titleMiddles = ["Alignment", "Synergy", "Bandwidth", "Action Items", "Roadblocks", "KPI", "ROI", "Paradigm", "Wheelhouse", "Touchpoint", "Circle Back", "Capacity"];
    const titleSuffixes = ["Sync", "Review", "Discussion", "Meeting", "Catch-up", "Huddle", "Session", "Workshop", "Standup", "Kickoff", "Check-in", "Debrief"];
    const chickenMessages = ["Double-click that!", "Are we aligned?", "Boil the ocean!", "Take it offline!", "Per my last email.", "Put a pin in it.", "Low hanging fruit!", "Shift the paradigm!", "What's the ROI?", "Circle back.", "You're on mute!"];

    const gameOvers = [
        "You asked a question at 4:59 PM. The meeting was extended by 45 minutes.",
        "You accidentally shared a tab with a job application open.",
        "You asked 'Can everyone see my screen?' 14 times. You died of embarrassment.",
        "TulTul noticed you were offline for 4 minutes. You are on a PIP.",
        "You volunteered to take notes. You are now the defacto project manager.",
        "Jane Doe from HR would like a quick word.",
        "You replied 'Reply All' to a company-wide email.",
        "You said 'Let's circle back'. Now you're stuck in a loop forever.",
        "You thought you were on mute and sighed heavily."
    ];

    let currentGameOverText = "";

    function generateMeetingTitle() {
        let p = titlePrefixes[Math.floor(Math.random() * titlePrefixes.length)];
        let m = titleMiddles[Math.floor(Math.random() * titleMiddles.length)];
        let s = titleSuffixes[Math.floor(Math.random() * titleSuffixes.length)];
        return `${p} ${m}\n${s}`;
    }

    // --- PARTICLES ---
    const particles = [];
    function spawnParticles(x, y, color, count = 15) {
        for(let i=0; i<count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                life: 1.0,
                color: color,
                size: Math.random() * 4 + 2
            });
        }
    }

    function updateAndDrawParticles() {
        for(let i=0; i<particles.length; i++) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.life -= 0.04;
            if(p.life > 0) {
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.globalAlpha = 1.0;
            } else { particles.splice(i, 1); i--; }
        }
    }

    // --- POWER UP STATES ---
    let activePowerUps = { shield: false, shrinkTimer: 0, slowTimer: 0 };
    let invincibilityTimer = 0; // For after shield breaks

    // --- ENTITIES ---

    // 1. The Player (Office Chair)
    const player = {
        x: 80, y: 350,
        baseWidth: 42, baseHeight: 42,
        hitWidth: 42, hitHeight: 42, // Actual collision box
        velocity: 0, gravity: 0.4, lift: -7.5, rotation: 0,
        
        draw: function() {
            // Blinking effect if invincible
            if (invincibilityTimer > 0 && Math.floor(frames / 5) % 2 === 0) return;

            ctx.save();
            ctx.translate(this.x + this.hitWidth/2, this.y + this.hitHeight/2);
            this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.08)));
            ctx.rotate(this.rotation);

            // Visual scaling
            let scaleFactor = (activePowerUps.shrinkTimer > 0) ? 0.6 : 1;
            ctx.scale(scaleFactor, scaleFactor);

            if (activePowerUps.shield) {
                ctx.fillStyle = 'rgba(0, 120, 212, 0.2)'; // Teams Blue
                ctx.beginPath(); ctx.arc(0, 0, this.baseWidth + 5, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#0078d4'; ctx.lineWidth = 2; ctx.stroke();
            }

            // Player Sprite Construction
            ctx.fillStyle = 'rgba(0,0,0,0.2)'; // Soft drop shadow
            ctx.fillRect(-this.baseWidth/2 + 3, -this.baseHeight/2 + 3, this.baseWidth, this.baseHeight);
            
            ctx.fillStyle = '#424242'; // Dark gray chair back
            ctx.fillRect(-this.baseWidth/2, -this.baseHeight/2, 15, this.baseHeight);
            ctx.fillStyle = '#0078d4'; // Teams blue shirt
            ctx.fillRect(-this.baseWidth/2 + 15, -this.baseHeight/4, 20, 25);
            ctx.fillStyle = '#ffb69b'; // Head
            ctx.fillRect(-this.baseWidth/2 + 10, -this.baseHeight/2 - 5, 18, 18);
            ctx.fillStyle = '#ffffff'; // Coffee Cup
            ctx.fillRect(-this.baseWidth/2 + 35, -this.baseHeight/4 + 5, 8, 10);
            
            ctx.restore();
        },
        
        update: function() {
            // Update actual collision hitboxes dynamically based on shrink powerup
            if (activePowerUps.shrinkTimer > 0) {
                this.hitWidth = this.baseWidth * 0.6;
                this.hitHeight = this.baseHeight * 0.6;
                activePowerUps.shrinkTimer--;
            } else {
                this.hitWidth = this.baseWidth;
                this.hitHeight = this.baseHeight;
            }

            if (invincibilityTimer > 0) invincibilityTimer--;

            this.velocity += this.gravity;
            this.y += this.velocity;
            
            if (this.y + this.hitHeight >= logicalHeight) { this.y = logicalHeight - this.hitHeight; handleCollision(); }
            if (this.y <= 0) { this.y = 0; this.velocity = 0; }
        },
        
        fly: function() {
            this.velocity = this.lift;
            spawnParticles(this.x, this.y + this.hitHeight, '#a6a6a6', 3);
        }
    };

    // 2. Power-Ups
    const collectibles = {
        array: [],
        types: [
            { id: 'SHIELD', color: '#0078d4', text: '☕' }, // Teams Blue
            { id: 'SLOW', color: '#107c41', text: '📶' },   // Excel Green
            { id: 'SHRINK', color: '#d83b01', text: '🚫' }  // Office Orange
        ],
        size: 32,

        draw: function() {
            for (let i = 0; i < this.array.length; i++) {
                let p = this.array[i];
                let bob = Math.sin(frames * 0.1) * 6;
                
                // Drop shadow
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                if (ctx.roundRect) {
                    ctx.beginPath(); ctx.roundRect(p.x + 3, p.y + bob + 3, this.size, this.size, 8); ctx.fill();
                }

                // Powerup Box
                ctx.fillStyle = p.type.color;
                if (ctx.roundRect) {
                    ctx.beginPath(); ctx.roundRect(p.x, p.y + bob, this.size, this.size, 8); ctx.fill();
                } else {
                    ctx.fillRect(p.x, p.y + bob, this.size, this.size);
                }
                
                ctx.fillStyle = '#ffffff';
                ctx.font = "18px 'Segoe UI Emoji', Arial";
                ctx.fillText(p.type.text, p.x + 5, p.y + 22 + bob);
            }
        },

        update: function() {
            for (let i = 0; i < this.array.length; i++) {
                let p = this.array[i];
                p.x -= currentScrollSpeed;
                let actualY = p.y + Math.sin(frames * 0.1) * 6;

                // Checking collision against the dynamically sized hit box
                if (player.x < p.x + this.size && player.x + player.hitWidth > p.x &&
                    player.y < actualY + this.size && player.y + player.hitHeight > actualY) {
                    
                    spawnParticles(p.x, actualY, p.type.color, 20);

                    if (p.type.id === 'SHIELD') activePowerUps.shield = true;
                    if (p.type.id === 'SLOW') activePowerUps.slowTimer = 300; 
                    if (p.type.id === 'SHRINK') activePowerUps.shrinkTimer = 300;
                    
                    this.array.splice(i, 1); i--; continue;
                }
                if (p.x + this.size < 0) { this.array.splice(i, 1); i--; }
            }
        }
    };

    // 3. Meeting Blocks (The Pipes) - WITH PERFECT GAP CALCULATION
    const meetings = {
        array: [],
        width: 140, // Wide to match calendar slots
        minGap: 120, // Minimum gap between blocks (player height ~42px + safety margin)
        
        draw: function() {
            for (let i = 0; i < this.array.length; i++) {
                let m = this.array[i];
                
                // Draw Blocks using Teams styling (Rounded corners on the right)
                ctx.fillStyle = 'rgba(0,0,0,0.1)'; // Shadow
                ctx.fillRect(m.x + 4, 0, this.width, m.top + 4);
                ctx.fillRect(m.x + 4, logicalHeight - m.bottom + 4, this.width, m.bottom);

                ctx.fillStyle = '#e6e6fa'; // Light purple background
                ctx.fillRect(m.x, 0, this.width, m.top);
                ctx.fillRect(m.x, logicalHeight - m.bottom, this.width, m.bottom);
                
                ctx.fillStyle = '#5c2d91'; // Dark purple left border (Iconic Teams calendar look)
                ctx.fillRect(m.x, 0, 6, m.top);
                ctx.fillRect(m.x, logicalHeight - m.bottom, 6, m.bottom);

                // --- TEXT INSIDE THE BLOCKS ---
                drawBoxedText(ctx, m.title, m.x + 15, 15, this.width - 20, m.top - 20, "bold 13px 'Segoe UI', Arial", "#242424");
                drawBoxedText(ctx, m.title, m.x + 15, logicalHeight - m.bottom + 15, this.width - 20, m.bottom - 20, "bold 13px 'Segoe UI', Arial", "#242424");

                // --- CHICKEN BOSS WITH SPRING ANIMATION ---
                if (m.hasChicken) {
                    if (m.x < logicalWidth - 20) { m.animScale += (1 - m.animScale) * 0.15; }
                    
                    let chickenY = logicalHeight - m.bottom + 30; 
                    let centerX = m.x - 20;
                    let centerY = chickenY + 30;

                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.scale(m.animScale, m.animScale); 
                    
                    // Teams Video Call UI Window
                    ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(-70, -40, 110, 85); // Shadow
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(-70, -40, 110, 80); // White frame
                    ctx.fillStyle = '#242424'; ctx.fillRect(-68, -38, 106, 76); // Dark video bg
                    
                    // Chicken Sprite
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(-30, -10, 30, 40); // Body
                    ctx.fillStyle = '#ffb900'; ctx.fillRect(-10, -5, 15, 10); // Beak
                    ctx.fillStyle = 'white'; ctx.fillRect(-20, -6, 8, 8); // Eye white
                    ctx.fillStyle = 'black'; ctx.fillRect(-16, -4, 4, 4); // Pupil
                    
                    // Floating Name Tag
                    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(-65, 20, 60, 14);
                    ctx.fillStyle = 'white'; ctx.font = "10px 'Segoe UI'"; ctx.fillText("Director", -62, 31);

                    // Teams styled Callout Bubble
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.moveTo(10, -50); ctx.lineTo(140, -50); ctx.lineTo(140, 10); ctx.lineTo(40, 10); ctx.lineTo(30, 20); ctx.lineTo(30, 10); ctx.lineTo(10, 10);
                    ctx.fill();
                    ctx.strokeStyle = '#e0e0e0'; ctx.stroke();

                    // Wrapped text
                    drawBoxedText(ctx, m.chickenMessage, 18, -40, 110, 45, "600 12px 'Segoe UI', Arial", "#242424");
                    
                    ctx.restore();
                }
            }
        },
        
        update: function() {
            if (activePowerUps.slowTimer > 0) { currentScrollSpeed = baseSpeed * 0.5; activePowerUps.slowTimer--; } 
            else { currentScrollSpeed = baseSpeed + (daysEscaped * 0.08); }

            let spawnRate = Math.max(70, 100 - (daysEscaped * 1.5)); 
            if (frames % Math.floor(spawnRate) === 0) {
                // PERFECT GAP CALCULATION: Ensure gaps are always passable
                let maxTopHeight = logicalHeight - this.minGap - 60; 
                let topHeight = Math.random() * (maxTopHeight - 60) + 60; 
                let bottomHeight = logicalHeight - this.minGap - topHeight;
                
                this.array.push({
                    x: logicalWidth,
                    top: topHeight,
                    bottom: bottomHeight,
                    title: generateMeetingTitle(),
                    hasChicken: Math.random() < 0.35,
                    chickenMessage: chickenMessages[Math.floor(Math.random() * chickenMessages.length)],
                    animScale: 0, 
                    passed: false,
                    chickenEscaped: false
                });

                if (Math.random() < 0.25) {
                    collectibles.array.push({
                        x: logicalWidth + (this.width / 2) - (collectibles.size / 2),
                        y: topHeight + (this.minGap / 2) - (collectibles.size / 2),
                        type: collectibles.types[Math.floor(Math.random() * collectibles.types.length)]
                    });
                }
            }
            
            for (let i = 0; i < this.array.length; i++) {
                let m = this.array[i];
                m.x -= currentScrollSpeed;
                
                // Collision uses the dynamically updated hitWidth and hitHeight
                if (player.x + player.hitWidth > m.x && player.x < m.x + this.width) {
                    if (player.y < m.top || player.y + player.hitHeight > logicalHeight - m.bottom) handleCollision();
                }
                
                if (m.x + this.width < player.x && !m.passed) {
                    daysEscaped++; m.passed = true;
                    if (m.hasChicken && !m.chickenEscaped) { chickenEscapes++; m.chickenEscaped = true; }
                }
                
                if (m.x + this.width + 100 < 0) { this.array.shift(); i--; }
            }
        },
        reset: function() { this.array = []; }
    };

    // --- UTILITY: TEXT WRAPPING ---
    function drawBoxedText(ctx, text, x, y, maxWidth, maxHeight, font, color) {
        ctx.font = font; ctx.fillStyle = color; ctx.textBaseline = 'top';
        let words = text.replace(/\n/g, " \n ").split(' ');
        let line = ''; let currentY = y;
        let lineHeight = parseInt(font.match(/\d+/)[0], 10) * 1.3;

        for(let n = 0; n < words.length; n++) {
            if (words[n] === '\n') {
                ctx.fillText(line, x, currentY);
                line = ''; currentY += lineHeight; continue;
            }
            let testLine = line + words[n] + ' ';
            let metrics = ctx.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                if (currentY + lineHeight * 2 > y + maxHeight) {
                    ctx.fillText(line.trim() + "...", x, currentY); return; 
                }
                ctx.fillText(line, x, currentY);
                line = words[n] + ' '; currentY += lineHeight;
            } else { line = testLine; }
        }
        if (currentY + lineHeight <= y + maxHeight) { ctx.fillText(line, x, currentY); }
        ctx.textBaseline = 'alphabetic'; // reset
    }

    // --- GAME LOOP & LOGIC ---
    function drawBackgroundCalendar() {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, logicalWidth, logicalHeight);
        
        // Horizontal calendar lines
        ctx.strokeStyle = '#edebe9'; 
        ctx.lineWidth = 1;
        for(let i = 0; i < logicalHeight; i+=60) {
            ctx.beginPath(); ctx.moveTo(50, i); ctx.lineTo(logicalWidth, i); ctx.stroke();
        }

        // Vertical day separators
        let fgOffset = (frames * currentScrollSpeed) % 200;
        for(let i = -200; i < logicalWidth; i+=200) {
            ctx.beginPath(); ctx.moveTo(i - fgOffset, 0); ctx.lineTo(i - fgOffset, logicalHeight); ctx.stroke();
        }

        // Time labels on the left (Static)
        ctx.fillStyle = '#605e5c';
        ctx.font = "12px 'Segoe UI'";
        for(let i = 0, hour = 8; i < logicalHeight; i+=60, hour++) {
            ctx.fillText(`${hour}:00 AM`, 5, i + 5);
        }

        // The Red "Current Time" Line
        ctx.strokeStyle = '#d13438';
        ctx.lineWidth = 2;
        let lineY = 400 + Math.sin(frames * 0.02) * 20; // slowly drifting up and down
        ctx.beginPath(); ctx.moveTo(50, lineY); ctx.lineTo(logicalWidth, lineY); ctx.stroke();
        ctx.fillStyle = '#d13438';
        ctx.beginPath(); ctx.arc(50, lineY, 4, 0, Math.PI*2); ctx.fill();
    }

    function handleCollision() {
        if (invincibilityTimer > 0) return; // Prevent double hits

        if (activePowerUps.shield) {
            activePowerUps.shield = false;
            invincibilityTimer = 60; // 1 second of invincibility to pass the pipe
            screenShake = 12; 
            spawnParticles(player.x, player.y, '#0078d4', 30);
        } else {
            screenShake = 25; 
            triggerGameOver();
        }
    }

    function triggerGameOver() {
        if(currentGameState !== 'GAMEOVER') {
            currentGameState = 'GAMEOVER';
            currentGameOverText = gameOvers[Math.floor(Math.random() * gameOvers.length)];
        }
    }

    function resetGame() {
        player.y = 350; player.x = 80; player.velocity = 0;
        meetings.reset(); collectibles.array = []; particles.length = 0;
        activePowerUps = { shield: false, shrinkTimer: 0, slowTimer: 0 };
        invincibilityTimer = 0;
        frames = 0; daysEscaped = 0; chickenEscapes = 0;
        currentScrollSpeed = baseSpeed; currentGameState = 'PLAYING';
    }

    function drawUI() {
        if (currentGameState === 'START') {
            ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(0,0, logicalWidth, logicalHeight);
            ctx.textAlign = "center";
            
            ctx.fillStyle = '#5c2d91';
            ctx.font = "bold 36px 'Segoe UI'"; ctx.fillText("OUT OF OFFICE", logicalWidth/2, 250);
            ctx.fillStyle = '#242424';
            ctx.font = "18px 'Segoe UI'"; ctx.fillText("Tap to Float. Avoid Meetings.", logicalWidth/2, 300);
            
            // Retro Powerup Legend
            ctx.fillStyle = '#f3f2f1';
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(logicalWidth/2 - 130, 360, 260, 120, 8); ctx.fill(); }
            ctx.strokeStyle = '#e0e0e0'; ctx.stroke();
            
            ctx.fillStyle = '#242424';
            ctx.font = "bold 14px 'Segoe UI'"; ctx.fillText("☕ Shield", logicalWidth/2 - 50, 390);
            ctx.fillText("📶 Bad Connection (Slow)", logicalWidth/2, 420);
            ctx.fillText("🚫 Camera Off (Shrink)", logicalWidth/2 - 10, 450);

            let alpha = Math.abs(Math.sin(frames * 0.05));
            ctx.fillStyle = `rgba(92, 45, 145, ${alpha})`;
            ctx.font = "bold 22px 'Segoe UI'"; ctx.fillText("TAP TO JOIN CALENDAR", logicalWidth/2, 580);
            ctx.textAlign = "left"; 
        }
        
        if (currentGameState === 'PLAYING') {
            ctx.fillStyle = '#242424';
            ctx.font = "bold 24px 'Segoe UI'"; ctx.fillText("Days: " + daysEscaped, 60, 40);
            
            if (activePowerUps.shield) { ctx.fillStyle = '#0078d4'; ctx.fillText("☕", 60, 80); }
            if (activePowerUps.slowTimer > 0) { ctx.fillStyle = '#107c41'; ctx.fillText("📶", 95, 80); }
            if (activePowerUps.shrinkTimer > 0) { ctx.fillStyle = '#d83b01'; ctx.fillText("🚫", 130, 80); }

            // Visual feedback for Bad Connection (Slow)
            if (activePowerUps.slowTimer > 0) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.fillRect(0,0, logicalWidth, logicalHeight);
                ctx.fillStyle = '#d13438';
                ctx.font = "bold 16px 'Segoe UI'"; ctx.textAlign = "center";
                ctx.fillText("Poor network quality...", logicalWidth/2, 60);
                ctx.textAlign = "left";
            }
        }
        
        if (currentGameState === 'GAMEOVER') {
            if(screenShake > 0) return; 
            
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0,0, logicalWidth, logicalHeight);
            
            // Teams Dialog Window
            ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.fillRect(15, 125, logicalWidth - 30, logicalHeight - 250);
            ctx.fillStyle = '#ffffff';
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(20, 120, logicalWidth - 40, logicalHeight - 240, 8); ctx.fill(); }
            
            // Window Header
            ctx.fillStyle = '#f3f2f1';
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(20, 120, logicalWidth - 40, 50, [8, 8, 0, 0]); ctx.fill(); }
            ctx.fillStyle = '#242424'; ctx.font = "600 16px 'Segoe UI'"; ctx.fillText("Meeting Ended", 40, 150);
            
            ctx.textAlign = "center";
            ctx.fillStyle = '#d13438'; ctx.font = "bold 24px 'Segoe UI'"; ctx.fillText("CATASTROPHIC SYNC", logicalWidth/2, 220);
            
            ctx.textAlign = "left";
            drawBoxedText(ctx, currentGameOverText, 40, 260, logicalWidth - 80, 100, "16px 'Segoe UI'", "#242424");
            
            // Stats styling like an attendance report
            ctx.fillStyle = '#f3f2f1'; ctx.fillRect(40, 360, logicalWidth - 80, 80);
            ctx.fillStyle = '#242424';
            ctx.font = "bold 18px 'Segoe UI'"; ctx.fillText("Focus Days Saved: " + daysEscaped, 60, 390);
            ctx.font = "16px 'Segoe UI'"; ctx.fillText("Polaroids (Chickens Dodged): " + chickenEscapes, 60, 420);

            // Buttons Teams Style
            ctx.textAlign = "center";
            ctx.fillStyle = '#25D366'; if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(45, 470, 160, 45, 4); ctx.fill(); }
            ctx.fillStyle = '#E1306C'; if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(245, 470, 160, 45, 4); ctx.fill(); }
            
            ctx.fillStyle = 'white'; ctx.font = "600 15px 'Segoe UI'";
            ctx.fillText("Share to WA", 125, 498); ctx.fillText("Share to IG", 325, 498);
            
            // "Leave" Rejoin button
            let alpha = Math.abs(Math.sin(frames * 0.05));
            ctx.fillStyle = `rgba(92, 45, 145, ${alpha})`; ctx.font = "bold 18px 'Segoe UI'";
            ctx.fillText("Tap anywhere to Rejoin", logicalWidth/2, 590);
            ctx.textAlign = "left"; 
        }
    }

    function loop() {
        ctx.save();
        if (screenShake > 0 && currentGameState === 'GAMEOVER') {
            let dx = (Math.random() - 0.5) * 20; let dy = (Math.random() - 0.5) * 20;
            ctx.translate(dx, dy); screenShake--;
        }

        drawBackgroundCalendar();

        if (currentGameState === 'PLAYING') {
            player.update(); collectibles.update(); meetings.update();
        }
        
        if (currentGameState === 'PLAYING' || currentGameState === 'GAMEOVER') {
            meetings.draw(); collectibles.draw(); player.draw(); updateAndDrawParticles();
        }
        
        ctx.restore(); 
        drawUI(); frames++; requestAnimationFrame(loop);
    }

    // --- INPUT HANDLING ---
    const handleInput = (e) => {
        if(e) e.preventDefault(); 
        if (currentGameState === 'START') currentGameState = 'PLAYING';
        else if (currentGameState === 'PLAYING') player.fly();
        else if (currentGameState === 'GAMEOVER' && screenShake <= 0) resetGame();
    };

    canvas.addEventListener('mousedown', handleInput);
    canvas.addEventListener('touchstart', handleInput, {passive: false});
    document.addEventListener('keydown', function(e) { if(e.code === 'Space') handleInput(); });

    loop();
</script>
</body>
</html>
