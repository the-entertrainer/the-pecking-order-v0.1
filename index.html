<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Out of Office: The Daily Sync</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Prevents mobile scrolling */
        }
        #gameCanvas {
            background-color: #1e1e24; /* Teams Dark Mode Background */
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            image-rendering: pixelated; /* Forces retro look */
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- GAME STATE ---
    let frames = 0;
    let daysEscaped = 0;
    let chickenEscapes = 0; // For the polaroid count
    let currentGameState = 'START'; // START, PLAYING, GAMEOVER
    let isClicking = false;

    // --- ARRAYS FOR RANDOM GENERATION ---
    const meetingTitles = [
        "Quick Sync (90 Mins)",
        "Synergy Alignment",
        "Pre-read Discussion",
        "Mandatory Fun Event",
        "Brainstorming the Pre-Brainstorm",
        "Quarterly Review",
        "Urgent: Action Required",
        "Post-Mortem Analysis"
    ];

    const gameOvers = [
        "Game Over. You asked a question at 4:59 PM. You missed dinner.",
        "Game Over. You made eye contact with the Chicken. You now own the Excel tracker.",
        "Game Over. You forgot to mute your mic while flushing. HR is calling.",
        "Game Over. You agreed to take notes. You are now the Project Manager.",
        "Game Over. You said 'Let's circle back'. Now you're stuck in a loop forever."
    ];

    let currentGameOverText = "";

    // --- ENTITIES ---

    // 1. The Player (Office Chair)
    // AI Sprite Guide: 64x64 pixel art of employee in rolling chair.
    const player = {
        x: 150,
        y: 200,
        width: 48,  // Hitbox slightly smaller than 64x64 sprite
        height: 48,
        velocity: 0,
        gravity: 0.25,
        lift: -6,
        
        draw: function() {
            // Placeholder: Replace with ctx.drawImage(playerSprite, this.x, this.y, 64, 64)
            ctx.fillStyle = '#ffcc00'; // Yellow pixel chair placeholder
            ctx.fillRect(this.x, this.y, this.width, this.height);
            
            // Draw a little face to show direction
            ctx.fillStyle = 'black';
            ctx.fillRect(this.x + 30, this.y + 10, 5, 5); // Eye
        },
        
        update: function() {
            this.velocity += this.gravity;
            this.y += this.velocity;
            
            // Floor collision
            if (this.y + this.height >= canvas.height) {
                this.y = canvas.height - this.height;
                triggerGameOver();
            }
            // Ceiling collision
            if (this.y <= 0) {
                this.y = 0;
                this.velocity = 0;
            }
        },
        
        fly: function() {
            this.velocity = this.lift;
        }
    };

    // 2. The Meeting Blocks (Obstacles)
    // AI Sprite Guide: 128px wide repeating solid purple/blue textures.
    const meetings = {
        array: [],
        width: 100,
        gap: 180, // Space between top and bottom blocks
        dx: 3,    // Speed of scrolling
        
        draw: function() {
            for (let i = 0; i < this.array.length; i++) {
                let m = this.array[i];
                
                // Draw Top Meeting Block
                ctx.fillStyle = '#4b3b85'; // Teams Purple
                ctx.fillRect(m.x, 0, this.width, m.top);
                
                // Draw Bottom Meeting Block
                ctx.fillRect(m.x, canvas.height - m.bottom, this.width, m.bottom);
                
                // Draw Meeting Titles (Simulating calendar text)
                ctx.fillStyle = 'white';
                ctx.font = "12px Courier New";
                
                // Top block text
                ctx.save();
                ctx.translate(m.x + 20, m.top - 20);
                ctx.fillText(m.title, 0, 0);
                ctx.restore();

                // Bottom block text
                ctx.save();
                ctx.translate(m.x + 20, canvas.height - m.bottom + 30);
                ctx.fillText(m.title, 0, 0);
                ctx.restore();

                // Draw Chicken Boss if applicable (Mini Window inside block)
                if (m.hasChicken) {
                    ctx.fillStyle = '#2b2b36'; // Dark window
                    ctx.fillRect(m.x - 10, m.top + (this.gap/2) - 40, 120, 80);
                    ctx.fillStyle = '#eb4034'; // Red chicken placeholder
                    ctx.fillRect(m.x + 30, m.top + (this.gap/2) - 20, 40, 40);
                    ctx.fillStyle = 'white';
                    ctx.font = "10px Courier New";
                    ctx.fillText("CIRCLING BACK!", m.x - 5, m.top + (this.gap/2) - 50);
                }
            }
        },
        
        update: function() {
            // Spawn new meetings every 150 frames
            if (frames % 150 === 0) {
                // Randomly calculate the top meeting height
                // Max top height is canvas height minus gap minus min bottom height
                let maxPos = canvas.height - this.gap - 50; 
                let topHeight = Math.random() * (maxPos - 50) + 50; 
                let bottomHeight = canvas.height - this.gap - topHeight;
                
                // 20% chance to spawn a Chicken Boss on this block
                let spawnChicken = Math.random() < 0.2;
                
                this.array.push({
                    x: canvas.width,
                    top: topHeight,
                    bottom: bottomHeight,
                    title: meetingTitles[Math.floor(Math.random() * meetingTitles.length)],
                    hasChicken: spawnChicken,
                    passed: false,
                    chickenEscaped: false
                });
            }
            
            for (let i = 0; i < this.array.length; i++) {
                let m = this.array[i];
                m.x -= this.dx;
                
                // Collision Detection (AABB)
                if (player.x + player.width > m.x && player.x < m.x + this.width) {
                    // Check top block
                    if (player.y < m.top) {
                        triggerGameOver();
                    }
                    // Check bottom block
                    if (player.y + player.height > canvas.height - m.bottom) {
                        triggerGameOver();
                    }
                    // Check Chicken Boss hit box
                    if (m.hasChicken) {
                        let chickenY = m.top + (this.gap/2) - 40;
                        if (player.y + player.height > chickenY && player.y < chickenY + 80) {
                             triggerGameOver();
                        }
                    }
                }
                
                // Score Update & Polaroid Collection
                if (m.x + this.width < player.x && !m.passed) {
                    daysEscaped++;
                    m.passed = true;
                    // If we passed a chicken, add a polaroid escape point
                    if (m.hasChicken && !m.chickenEscaped) {
                        chickenEscapes++;
                        m.chickenEscaped = true;
                    }
                }
                
                // Remove off-screen blocks
                if (m.x + this.width < 0) {
                    this.array.shift();
                    i--;
                }
            }
        },
        
        reset: function() {
            this.array = [];
        }
    };

    // --- GAME LOOP & LOGIC ---

    function triggerGameOver() {
        currentGameState = 'GAMEOVER';
        currentGameOverText = gameOvers[Math.floor(Math.random() * gameOvers.length)];
    }

    function resetGame() {
        player.y = 200;
        player.velocity = 0;
        meetings.reset();
        frames = 0;
        daysEscaped = 0;
        chickenEscapes = 0;
        currentGameState = 'PLAYING';
    }

    function drawUI() {
        if (currentGameState === 'START') {
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(0,0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = "30px Courier New";
            ctx.fillText("OUT OF OFFICE: THE DAILY SYNC", 120, 250);
            ctx.font = "20px Courier New";
            ctx.fillText("Click or Tap to Float. Avoid Meetings.", 160, 300);
            ctx.fillText("Click to Start", 310, 350);
        }
        
        if (currentGameState === 'PLAYING') {
            ctx.fillStyle = 'white';
            ctx.font = "24px Courier New";
            ctx.fillText("Days Escaped: " + daysEscaped, 20, 40);
        }
        
        if (currentGameState === 'GAMEOVER') {
            // "Teams Call" UI Overlay
            ctx.fillStyle = '#1e1e24';
            ctx.fillRect(50, 50, canvas.width - 100, canvas.height - 100);
            ctx.strokeStyle = '#4b3b85';
            ctx.lineWidth = 5;
            ctx.strokeRect(50, 50, canvas.width - 100, canvas.height - 100);
            
            ctx.fillStyle = '#eb4034';
            ctx.font = "30px Courier New";
            ctx.fillText("MEETING JOINED.", 280, 120);
            
            ctx.fillStyle = 'white';
            ctx.font = "18px Courier New";
            
            // Word wrap function for the game over text
            wrapText(ctx, currentGameOverText, 80, 180, canvas.width - 160, 25);
            
            ctx.fillStyle = '#ffcc00';
            ctx.font = "24px Courier New";
            ctx.fillText("Total Days Escaped: " + daysEscaped, 250, 350);
            
            ctx.fillStyle = '#7289da';
            ctx.fillText("Polaroids Collected (Chickens Dodged): " + chickenEscapes, 120, 390);

            // Fake Share Buttons
            ctx.fillStyle = '#25D366'; // WhatsApp Green
            ctx.fillRect(200, 450, 180, 40);
            ctx.fillStyle = '#E1306C'; // Instagram Pink
            ctx.fillRect(420, 450, 180, 40);
            
            ctx.fillStyle = 'white';
            ctx.font = "16px Courier New";
            ctx.fillText("Share to WA", 230, 475);
            ctx.fillText("Share to IG", 450, 475);
            
            ctx.font = "14px Courier New";
            ctx.fillText("Click anywhere to Rejoin the Calendar", 240, 530);
        }
    }

    // Helper function for wrapping text on canvas
    function wrapText(context, text, x, y, maxWidth, lineHeight) {
        let words = text.split(' ');
        let line = '';
        for(let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            let metrics = context.measureText(testLine);
            let testWidth = metrics.width;
            if (testWidth > maxWidth && n > 0) {
                context.fillText(line, x, y);
                line = words[n] + ' ';
                y += lineHeight;
            } else {
                line = testLine;
            }
        }
        context.fillText(line, x, y);
    }

    function loop() {
        // Clear Canvas
        ctx.fillStyle = '#1e1e24'; // Background color
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Background Grid (simulating calendar rows)
        ctx.strokeStyle = '#2b2b36';
        ctx.lineWidth = 1;
        for(let i=0; i<canvas.height; i+=50) {
            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(canvas.width, i);
            ctx.stroke();
        }

        if (currentGameState === 'PLAYING') {
            player.update();
            meetings.update();
            frames++;
        }
        
        // Draw logic is separate from update logic
        if (currentGameState === 'PLAYING' || currentGameState === 'GAMEOVER') {
            meetings.draw();
            player.draw();
        }
        
        drawUI();
        
        requestAnimationFrame(loop);
    }

    // --- INPUT HANDLING ---
    
    // Mouse / Touch
    canvas.addEventListener('mousedown', handleInput);
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault(); // Prevent screen zooming/scrolling
        handleInput();
    });

    // Keyboard (Spacebar)
    document.addEventListener('keydown', function(e) {
        if(e.code === 'Space') {
            handleInput();
        }
    });

    function handleInput() {
        if (currentGameState === 'START') {
            currentGameState = 'PLAYING';
        } else if (currentGameState === 'PLAYING') {
            player.fly();
        } else if (currentGameState === 'GAMEOVER') {
            resetGame();
        }
    }

    // Start the game loop
    loop();

</script>
</body>
</html>
