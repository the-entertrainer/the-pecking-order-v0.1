<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Pecking Order v0.3</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #111;
            /* Prevents the rubber-band refresh effect on iOS */
            overscroll-behavior: none;
            touch-action: none; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
        // --- ASSET DATA URIs (Patched for iOS/Safari WebKit Bug) ---
        // Explicit width and height attributes added to the base SVG strings to prevent 0x0 rendering.
        const svgWorker = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTYiIGhlaWdodD0iMTYiIHZpZXdCb3g9IjAgMCAxNiAxNiIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB4PSI0IiB5PSIyIiB3aWR0aD0iOCIgaGVpZ2h0PSI2IiBmaWxsPSIjZmZjYzk5Ii8+PHJlY3QgeD0iMyIgeT0iOCIgd2lkdGg9IjEwIiBoZWlnaHQ9IjgiIGZpbGw9IiMxYTM2NWIiLz48cmVjdCB4PSI3IiB5PSI4IiB3aWR0aD0iMiIgaGVpZ2h0PSI0IiBmaWxsPSIjZmZkMDAwIi8+PC9zdmc+';
        const svgDesk = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIiIGhlaWdodD0iMTYiIHZpZXdCb3g9IjAgMCAzMiAxNiIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMzIiIGhlaWdodD0iMTYiIGZpbGw9IiM4YzkyOTgiLz48cmVjdCB4PSIwIiB5PSI3IiB3aWR0aD0iMzIiIGhlaWdodD0iMiIgZmlsbD0iIzU1NWM2MiIvPjxjaXJjbGUgY3g9IjI0IiBjeT0iNCIgcj0iMiIgZmlsbD0iIzYwNGEzNiIgb3BhY2l0eT0iMC41Ii8+PC9zdmc+';
        const svgStapler = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cGF0aCBkPSJNMjIgMThMMjIgMThMMjIgMTZMMiAxNloiIGZpbGw9IiM1NTVjNjIiLz48cGF0aCBkPSJNMjIgMTZMMiAxMEwyIDZMMjIgMTJaIiBmaWxsPSIjYmJiIi8+PC9zdmc+';
        const svgRooster = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHZpZXdCb3g9IjAgMCA2NCA2NCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48Y2lyY2xlIGN4PSIzMiIgY3k9IjMyIiByPSIyNCIgZmlsbD0iI2ZmZiIvPjxjaXJjbGUgY3g9IjIwIiBjeT0iMjQiIHI9IjYiIGZpbGw9IiMwZjAiLz48Y2lyY2xlIGN4PSIyMCIgY3k9IjI0IiByPSIyIiBmaWxsPSIjMDAwIi8+PHBhdGggZD0iTTMyIDhMMjQgMEw0MCAwWiIgZmlsbD0iI2YwMCIvPjxwYXRoIGQ9Ik04IDMyTDE2IDM3TDggNDJaIiBmaWxsPSIjOTk5Ii8+PC9zdmc+';

        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            width: 720,  // AAA Mobile standard Portrait width
            height: 1280, // AAA Mobile standard Portrait height
            backgroundColor: '#1e1e24',
            pixelArt: true, // Forces crisp, unblurred rendering of 8-bit sprites
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 3500 }, // Heavy gravity for snappy mobile gameplay
                    debug: false
                }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);

        let player, desk, obstacles, rooster;
        let isFlipped = false;
        let gameSpeed = 450; 
        let score = 0;
        let isGameOver = false;
        let spawnTimer;

        let uiLayer;
        let scoreText;
        let gameOverPanel;
        let finalScoreText;

        function preload() {
            this.load.image('worker', svgWorker);
            this.load.image('desk', svgDesk);
            this.load.image('stapler', svgStapler);
            this.load.image('rooster', svgRooster);
        }

        function create() {
            const centerX = this.cameras.main.width / 2;
            const centerY = this.cameras.main.height / 2;

            // Background Rooster
            rooster = this.add.image(centerX, centerY - 300, 'rooster').setScale(8);
            rooster.setAlpha(0.15);
            this.tweens.add({
                targets: rooster,
                scaleY: 8.5,
                scaleX: 7.8,
                duration: 2500,
                yoyo: true,
                repeat: -1,
                ease: 'Sine.easeInOut'
            });

            // The Desk
            desk = this.add.tileSprite(centerX, centerY, 1440, 64, 'desk').setScale(1.5);
            this.physics.add.existing(desk, true);

            // The Player
            player = this.physics.add.sprite(150, centerY - 150, 'worker').setScale(4.5);
            player.body.setSize(10, 14); // Forgiving hitbox
            player.setCollideWorldBounds(true);
            this.physics.add.collider(player, desk);

            // Obstacles
            obstacles = this.physics.add.group();
            this.physics.add.overlap(player, obstacles, triggerGameOver, null, this);

            // In-Game UI
            scoreText = this.add.text(centerX, 150, 'MINUTES SAVED: 0', { 
                fontFamily: 'Courier New, Courier, monospace', fontSize: '48px', fill: '#00ff00', fontStyle: 'bold' 
            }).setOrigin(0.5);

            const instructionText = this.add.text(centerX, 220, 'TAP TO PIVOT', { 
                fontFamily: 'Courier New, Courier, monospace', fontSize: '28px', fill: '#ffffff', alpha: 0.5 
            }).setOrigin(0.5);

            // Game Over Panel
            gameOverPanel = this.add.container(centerX, centerY).setDepth(100).setVisible(false);
            const bg = this.add.rectangle(0, 0, 650, 450, 0x000000, 0.95).setStrokeStyle(4, 0xff0000);
            const title = this.add.text(0, -140, 'REDUNDANT!', { fontFamily: 'Courier New', fontSize: '64px', fill: '#ff0000', fontStyle: 'bold' }).setOrigin(0.5);
            finalScoreText = this.add.text(0, -20, '', { fontFamily: 'Courier New', fontSize: '32px', fill: '#ffffff', align: 'center' }).setOrigin(0.5);
            const restartBtn = this.add.text(0, 120, '> TAP TO REAPPLY <', { fontFamily: 'Courier New', fontSize: '40px', fill: '#00ff00' }).setOrigin(0.5);
            
            this.tweens.add({ targets: restartBtn, alpha: 0, duration: 500, yoyo: true, repeat: -1 });
            gameOverPanel.add([bg, title, finalScoreText, restartBtn]);

            // Input Handler
            this.input.on('pointerdown', handleInput, this);

            // Spawner
            spawnTimer = this.time.addEvent({
                delay: 1000,
                callback: spawnObstacle,
                callbackScope: this,
                loop: true
            });
        }

        function handleInput() {
            if (isGameOver) {
                restartGame.call(this);
                return;
            }

            isFlipped = !isFlipped;
            player.setFlipY(isFlipped);
            
            if (isFlipped) {
                this.physics.world.gravity.y = -3500;
                player.setVelocityY(-400); 
            } else {
                this.physics.world.gravity.y = 3500;
                player.setVelocityY(400);
            }
        }

        function spawnObstacle() {
            if (isGameOver) return;

            const isTop = Math.random() > 0.5;
            const centerY = this.cameras.main.height / 2;
            const yPos = isTop ? centerY - 85 : centerY + 85; 

            const obstacle = obstacles.create(850, yPos, 'stapler').setScale(3);
            obstacle.body.setSize(20, 16); 
            
            if (!isTop) {
                obstacle.setFlipY(true);
            }

            obstacle.setVelocityX(-gameSpeed);
            obstacle.setImmovable(true);
            obstacle.body.allowGravity = false;

            gameSpeed += 5;
            spawnTimer.delay = Math.max(500, spawnTimer.delay - 10);
        }

        function update() {
            if (isGameOver) return;

            desk.tilePositionX += (gameSpeed * 0.015);
            score += 0.05;
            scoreText.setText(`MINUTES SAVED: ${Math.floor(score)}`);

            obstacles.getChildren().forEach(obs => {
                if (obs.x < -100) {
                    obs.destroy();
                }
            });
        }

        function triggerGameOver() {
            if (isGameOver) return; 
            isGameOver = true;
            this.physics.pause();
            
            player.setTint(0xff0000);
            this.cameras.main.shake(200, 0.015);

            finalScoreText.setText(`You saved ${Math.floor(score)} minutes.\n\nYour position has been\ngiven to Jane Doe.`);
            gameOverPanel.setVisible(true);
            
            this.time.delayedCall(500, () => {
                this.input.once('pointerdown', restartGame, this);
            });
        }

        function restartGame() {
            isGameOver = false;
            score = 0;
            gameSpeed = 450;
            isFlipped = false;
            this.physics.world.gravity.y = 3500;
            this.scene.restart();
        }
    </script>
</body>
</html>
