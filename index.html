<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=portrait">
    <title>Out of Office: The Daily Sync</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050508;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #gameWrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 450px;
            max-height: 850px;
            box-shadow: 0 0 50px rgba(255, 0, 128, 0.2);
        }
        #gameCanvas {
            background-color: #120b29; /* Deep neon night sky */
            width: 100%;
            height: 100%;
            image-rendering: pixelated; /* Forces retro blocky look */
        }
    </style>
</head>
<body>

<div id="gameWrapper">
    <canvas id="gameCanvas" width="450" height="800"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- GAME STATE ---
    let frames = 0;
    let daysEscaped = 0;
    let chickenEscapes = 0;
    let currentGameState = 'START'; 
    let baseSpeed = 4;
    let currentScrollSpeed = baseSpeed;
    let screenShake = 0;

    // --- PROCEDURAL GENERATORS ---
    const titlePrefixes = ["Quick", "Mandatory", "Optional", "Urgent", "Daily", "Weekly", "Q3", "Q4", "Strategic", "Tactical", "Deep Dive", "Touchbase", "Synergy", "Post-Mortem"];
    const titleMiddles = ["Alignment", "Synergy", "Bandwidth", "Action Items", "Roadblocks", "KPI", "ROI", "Paradigm", "Wheelhouse", "Deep Dive", "Touchpoint", "Circle Back", "Capacity"];
    const titleSuffixes = ["Sync", "Review", "Discussion", "Meeting", "Catch-up", "Huddle", "Session", "Workshop", "Standup", "Kickoff", "Check-in", "Debrief", "Round Table"];
    const chickenMessages = ["Double-click that!", "Are we aligned?", "Boil the ocean!", "Take it offline!", "Per my last email.", "Put a pin in it.", "Low hanging fruit!", "Shift the paradigm!", "What's the ROI?", "Circle back.", "You're on mute!"];

    const gameOvers = [
        "Game Over. You asked a question at 4:59 PM. The meeting extended by 45 minutes.",
        "Game Over. You accidentally shared a tab with a job application open.",
        "Game Over. You asked 'Can everyone see my screen?' 14 times.",
        "Game Over. You were assigned to a 'Tiger Team'. It's just more work.",
        "Game Over. You replied 'Reply All' to a company-wide email.",
        "Game Over. You said 'Let's circle back'. Now you're stuck in a loop forever."
    ];

    let currentGameOverText = "";

    function generateMeetingTitle() {
        let p = titlePrefixes[Math.floor(Math.random() * titlePrefixes.length)];
        let m = titleMiddles[Math.floor(Math.random() * titleMiddles.length)];
        let s = titleSuffixes[Math.floor(Math.random() * titleSuffixes.length)];
        return `${p} ${m}\n${s}`; // Added newline for better boxing
    }

    // --- PARTICLES ---
    const particles = [];
    function spawnParticles(x, y, color, count = 15) {
        for(let i=0; i<count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                life: 1.0,
                color: color,
                size: Math.random() * 4 + 2
            });
        }
    }

    function updateAndDrawParticles() {
        for(let i=0; i<particles.length; i++) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.04;
            if(p.life > 0) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, p.size, p.size); // Blocky particles
                ctx.globalAlpha = 1.0;
            } else {
                particles.splice(i, 1); i--;
            }
        }
    }

    // --- PARALLAX BACKGROUND ---
    const buildingsLayer1 = [];
    const buildingsLayer2 = [];
    for(let i=0; i<10; i++) {
        buildingsLayer1.push({ x: i * 80, width: 60 + Math.random()*40, height: 100 + Math.random()*150 });
        buildingsLayer2.push({ x: i * 120, width: 80 + Math.random()*60, height: 200 + Math.random()*200 });
    }

    // --- POWER UP STATES ---
    let activePowerUps = { shield: false, shrinkTimer: 0, slowTimer: 0 };

    // --- ENTITIES ---

    // 1. The Player (Office Chair)
    const player = {
        x: 80, y: 350,
        baseWidth: 42, baseHeight: 42,
        width: 42, height: 42,
        velocity: 0, gravity: 0.4, lift: -7.5, rotation: 0,
        
        draw: function() {
            ctx.save();
            ctx.translate(this.x + this.width/2, this.y + this.height/2);
            this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.08)));
            ctx.rotate(this.rotation);

            if (activePowerUps.shrinkTimer > 0) {
                ctx.scale(0.6, 0.6);
                activePowerUps.shrinkTimer--;
            }

            if (activePowerUps.shield) {
                ctx.fillStyle = 'rgba(0, 243, 255, 0.3)';
                ctx.beginPath(); ctx.arc(0, 0, this.width + 5, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 2; ctx.stroke();
            }

            // HD Blocky Player Sprite Construction
            ctx.fillStyle = '#000000'; // Shadow base
            ctx.fillRect(-this.baseWidth/2 + 4, -this.baseHeight/2 + 4, this.baseWidth, this.baseHeight);
            
            ctx.fillStyle = '#2b2b36'; // Chair back
            ctx.fillRect(-this.baseWidth/2, -this.baseHeight/2, 15, this.baseHeight);
            ctx.fillStyle = '#ffcc00'; // Employee Shirt
            ctx.fillRect(-this.baseWidth/2 + 15, -this.baseHeight/4, 20, 25);
            ctx.fillStyle = '#ffaaeb'; // Head
            ctx.fillRect(-this.baseWidth/2 + 10, -this.baseHeight/2 - 5, 18, 18);
            ctx.fillStyle = '#ffffff'; // Coffee Cup
            ctx.fillRect(-this.baseWidth/2 + 35, -this.baseHeight/4 + 5, 8, 10);
            
            ctx.restore();
        },
        
        update: function() {
            this.velocity += this.gravity;
            this.y += this.velocity;
            
            if (this.y + this.height >= canvas.height) { this.y = canvas.height - this.height; handleCollision(); }
            if (this.y <= 0) { this.y = 0; this.velocity = 0; }
        },
        
        fly: function() {
            this.velocity = this.lift;
            spawnParticles(this.x, this.y + this.height, '#ffffff', 5);
        }
    };

    // 2. Power-Ups
    const collectibles = {
        array: [],
        types: [
            { id: 'SHIELD', color: '#00f3ff', text: '☕' },
            { id: 'SLOW', color: '#39ff14', text: '📶' },
            { id: 'SHRINK', color: '#ff007f', text: '🚫' }
        ],
        size: 30,

        draw: function() {
            for (let i = 0; i < this.array.length; i++) {
                let p = this.array[i];
                let bob = Math.sin(frames * 0.1) * 6;
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(p.x + 4, p.y + bob + 4, this.size, this.size);
                
                // Box
                ctx.fillStyle = p.type.color;
                ctx.fillRect(p.x, p.y + bob, this.size, this.size);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(p.x + 2, p.y + bob + 2, this.size - 4, this.size - 4);
                
                ctx.fillStyle = 'black';
                ctx.font = "18px Arial";
                ctx.fillText(p.type.text, p.x + 4, p.y + 22 + bob);
            }
        },

        update: function() {
            for (let i = 0; i < this.array.length; i++) {
                let p = this.array[i];
                p.x -= currentScrollSpeed;
                let actualY = p.y + Math.sin(frames * 0.1) * 6;

                if (player.x < p.x + this.size && player.x + player.width > p.x &&
                    player.y < actualY + this.size && player.y + player.height > actualY) {
                    
                    spawnParticles(p.x, actualY, p.type.color, 20);

                    if (p.type.id === 'SHIELD') activePowerUps.shield = true;
                    if (p.type.id === 'SLOW') activePowerUps.slowTimer = 300; 
                    if (p.type.id === 'SHRINK') activePowerUps.shrinkTimer = 300;
                    
                    this.array.splice(i, 1); i--; continue;
                }
                if (p.x + this.size < 0) { this.array.splice(i, 1); i--; }
            }
        }
    };

    // 3. Meeting Blocks (The Pipes)
    const meetings = {
        array: [],
        width: 130, // Wider to fit text inside
        gap: 230, 
        
        draw: function() {
            for (let i = 0; i < this.array.length; i++) {
                let m = this.array[i];
                
                // HD Blocky Pipe Construction
                ctx.fillStyle = '#110b1a'; // Deep shadow
                ctx.fillRect(m.x + 6, 0, this.width, m.top + 6);
                ctx.fillRect(m.x + 6, canvas.height - m.bottom + 6, this.width, m.bottom);

                ctx.fillStyle = '#42247a'; // Main block color
                ctx.fillRect(m.x, 0, this.width, m.top);
                ctx.fillRect(m.x, canvas.height - m.bottom, this.width, m.bottom);
                
                ctx.fillStyle = '#6b43bd'; // Highlight edge
                ctx.fillRect(m.x, 0, 6, m.top);
                ctx.fillRect(m.x, canvas.height - m.bottom, 6, m.bottom);
                ctx.fillRect(m.x, m.top - 6, this.width, 6);
                ctx.fillRect(m.x, canvas.height - m.bottom, this.width, 6);

                // --- TEXT WRAPPED STRICTLY INSIDE THE BLOCKS ---
                drawBoxedText(ctx, m.title, m.x + 12, 15, this.width - 24, m.top - 20, "bold 14px Courier New", "#ffffff");
                drawBoxedText(ctx, m.title, m.x + 12, canvas.height - m.bottom + 15, this.width - 24, m.bottom - 20, "bold 14px Courier New", "#ffffff");

                // --- CHICKEN BOSS WITH SPRING ANIMATION ---
                if (m.hasChicken) {
                    // Calculate animation scale (Spring effect)
                    if (m.x < canvas.width - 20) {
                        m.animScale += (1 - m.animScale) * 0.15; // Smooth ease-out
                    }
                    
                    let chickenY = canvas.height - m.bottom + 30; 
                    let centerX = m.x - 30;
                    let centerY = chickenY + 40;

                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.scale(m.animScale, m.animScale); // Pop up animation
                    
                    // Chicken Window
                    ctx.fillStyle = '#000000'; ctx.fillRect(-66, -36, 110, 80); // Shadow
                    ctx.fillStyle = '#222233'; ctx.fillRect(-70, -40, 110, 80); // Base
                    ctx.fillStyle = '#ff0055'; ctx.fillRect(-65, -35, 100, 70); // Red screen
                    
                    // Blocky Chicken Sprite
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(-30, -10, 30, 40); // Body
                    ctx.fillStyle = '#ffcc00'; ctx.fillRect(-10, -5, 15, 10); // Beak
                    ctx.fillStyle = 'black'; ctx.fillRect(-20, -5, 6, 6); // Eye
                    
                    // Dynamic Callout Bubble inside animation context
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.moveTo(10, -50); ctx.lineTo(130, -50); ctx.lineTo(130, 10); ctx.lineTo(40, 10); ctx.lineTo(30, 25); ctx.lineTo(30, 10); ctx.lineTo(10, 10);
                    ctx.fill();
                    ctx.fillStyle = 'black';
                    ctx.stroke();

                    // Wrapped text inside bubble
                    drawBoxedText(ctx, m.chickenMessage, 18, -40, 100, 45, "bold 12px Courier New", "#000000");
                    
                    ctx.restore();
                }
            }
        },
        
        update: function() {
            if (activePowerUps.slowTimer > 0) { currentScrollSpeed = baseSpeed * 0.5; activePowerUps.slowTimer--; } 
            else { currentScrollSpeed = baseSpeed + (daysEscaped * 0.08); }

            let spawnRate = Math.max(70, 100 - (daysEscaped * 1.5)); 
            if (frames % Math.floor(spawnRate) === 0) {
                let maxPos = canvas.height - this.gap - 60; 
                let topHeight = Math.random() * (maxPos - 60) + 60; 
                let bottomHeight = canvas.height - this.gap - topHeight;
                
                this.array.push({
                    x: canvas.width,
                    top: topHeight,
                    bottom: bottomHeight,
                    title: generateMeetingTitle(),
                    hasChicken: Math.random() < 0.35,
                    chickenMessage: chickenMessages[Math.floor(Math.random() * chickenMessages.length)],
                    animScale: 0, // Starts at 0 for animation
                    passed: false,
                    chickenEscaped: false
                });

                if (Math.random() < 0.25) {
                    collectibles.array.push({
                        x: canvas.width + (this.width / 2) - (collectibles.size / 2),
                        y: topHeight + (this.gap / 2) - (collectibles.size / 2),
                        type: collectibles.types[Math.floor(Math.random() * collectibles.types.length)]
                    });
                }
            }
            
            for (let i = 0; i < this.array.length; i++) {
                let m = this.array[i];
                m.x -= currentScrollSpeed;
                
                if (player.x + player.width > m.x && player.x < m.x + this.width) {
                    if (player.y < m.top || player.y + player.height > canvas.height - m.bottom) handleCollision();
                }
                
                if (m.x + this.width < player.x && !m.passed) {
                    daysEscaped++; m.passed = true;
                    if (m.hasChicken && !m.chickenEscaped) { chickenEscapes++; m.chickenEscaped = true; }
                }
                
                if (m.x + this.width + 100 < 0) { this.array.shift(); i--; }
            }
        },
        reset: function() { this.array = []; }
    };

    // --- UTILITY: TEXT WRAPPING INSIDE A RIGID BOX ---
    function drawBoxedText(ctx, text, x, y, maxWidth, maxHeight, font, color) {
        ctx.font = font;
        ctx.fillStyle = color;
        ctx.textBaseline = 'top';
        let words = text.replace(/\n/g, " \n ").split(' ');
        let line = '';
        let currentY = y;
        let lineHeight = parseInt(font, 10) * 1.2;

        for(let n = 0; n < words.length; n++) {
            if (words[n] === '\n') {
                ctx.fillText(line, x, currentY);
                line = ''; currentY += lineHeight;
                continue;
            }
            let testLine = line + words[n] + ' ';
            let metrics = ctx.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                if (currentY + lineHeight * 2 > y + maxHeight) {
                    ctx.fillText(line.trim() + "...", x, currentY); // Truncate to prevent spill
                    return; 
                }
                ctx.fillText(line, x, currentY);
                line = words[n] + ' ';
                currentY += lineHeight;
            } else { line = testLine; }
        }
        if (currentY + lineHeight <= y + maxHeight) { ctx.fillText(line, x, currentY); }
    }

    // --- GAME LOOP & LOGIC ---
    function drawBackgroundParallax() {
        // Gradient Sky
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, "#08051a");
        grad.addColorStop(0.6, "#2a0845");
        grad.addColorStop(1, "#6441a5");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Deep Parallax City
        ctx.fillStyle = '#0f0822';
        buildingsLayer2.forEach(b => {
            b.x -= currentScrollSpeed * 0.1;
            if(b.x + b.width < 0) b.x = canvas.width + Math.random()*50;
            ctx.fillRect(b.x, canvas.height - b.height, b.width, b.height);
        });

        // Mid Parallax City
        ctx.fillStyle = '#1c0f3d';
        buildingsLayer1.forEach(b => {
            b.x -= currentScrollSpeed * 0.3;
            if(b.x + b.width < 0) b.x = canvas.width + Math.random()*50;
            ctx.fillRect(b.x, canvas.height - b.height, b.width, b.height);
        });

        // Retrowave Calendar Grid Floor
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.2)'; // Cyberpunk cyan
        ctx.lineWidth = 2;
        let fgOffset = (frames * currentScrollSpeed) % 60;
        for(let i = -60; i < canvas.width; i+=60) {
            ctx.beginPath(); ctx.moveTo(i - fgOffset, 0); ctx.lineTo(i - fgOffset, canvas.height); ctx.stroke();
        }
        for(let j=0; j<canvas.height; j+=60) {
            ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
        }
    }

    function handleCollision() {
        if (activePowerUps.shield) {
            activePowerUps.shield = false;
            player.x += 15; player.velocity = -4; 
            screenShake = 12; 
            spawnParticles(player.x, player.y, '#00f3ff', 30);
        } else {
            screenShake = 25; 
            triggerGameOver();
        }
    }

    function triggerGameOver() {
        if(currentGameState !== 'GAMEOVER') {
            currentGameState = 'GAMEOVER';
            currentGameOverText = gameOvers[Math.floor(Math.random() * gameOvers.length)];
        }
    }

    function resetGame() {
        player.y = 350; player.x = 80; player.velocity = 0;
        meetings.reset(); collectibles.array = []; particles.length = 0;
        activePowerUps = { shield: false, shrinkTimer: 0, slowTimer: 0 };
        frames = 0; daysEscaped = 0; chickenEscapes = 0;
        currentScrollSpeed = baseSpeed; currentGameState = 'PLAYING';
    }

    function drawTextWithShadow(text, x, y, font, color, shadowColor = 'black', shadowOffset = 4) {
        ctx.font = font; ctx.fillStyle = shadowColor; ctx.fillText(text, x + shadowOffset, y + shadowOffset);
        ctx.fillStyle = color; ctx.fillText(text, x, y); 
    }

    function drawUI() {
        if (currentGameState === 'START') {
            ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0,0, canvas.width, canvas.height);
            ctx.textAlign = "center";
            drawTextWithShadow("OUT OF OFFICE", canvas.width/2, 250, "bold 36px Courier New", "#00f3ff", "#ff007f");
            drawTextWithShadow("Tap to Float.", canvas.width/2, 320, "bold 20px Courier New", "#ffffff");
            
            // Retro Powerup Legend
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(canvas.width/2 - 120, 400, 240, 100);
            drawTextWithShadow("☕ Shield  📶 Slow  🚫 Shrink", canvas.width/2, 450, "bold 14px Courier New", "#ffcc00");

            let alpha = Math.abs(Math.sin(frames * 0.05));
            ctx.fillStyle = `rgba(255, 0, 128, ${alpha})`;
            ctx.font = "bold 24px Courier New"; ctx.fillText("TAP TO START", canvas.width/2, 600);
            ctx.textAlign = "left"; 
        }
        
        if (currentGameState === 'PLAYING') {
            drawTextWithShadow("Days: " + daysEscaped, 20, 40, "bold 26px Courier New", "#ffffff");
            if (activePowerUps.shield) drawTextWithShadow("☕", 20, 80, "24px Arial", "white");
            if (activePowerUps.slowTimer > 0) drawTextWithShadow("📶", 55, 80, "24px Arial", "white");
            if (activePowerUps.shrinkTimer > 0) drawTextWithShadow("🚫", 90, 80, "24px Arial", "white");
        }
        
        if (currentGameState === 'GAMEOVER') {
            if(screenShake > 0) return; 
            
            // HD Overlay
            ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#1c0f3d'; ctx.fillRect(20, 100, canvas.width - 40, canvas.height - 200);
            ctx.strokeStyle = '#ff007f'; ctx.lineWidth = 6; ctx.strokeRect(20, 100, canvas.width - 40, canvas.height - 200);
            
            ctx.textAlign = "center";
            drawTextWithShadow("MEETING JOINED", canvas.width/2, 160, "bold 30px Courier New", "#ff0055");
            
            ctx.textAlign = "left";
            drawBoxedText(ctx, currentGameOverText, 40, 220, canvas.width - 80, 100, "bold 18px Courier New", "#ffffff");
            
            ctx.textAlign = "center";
            drawTextWithShadow("Days Escaped: " + daysEscaped, canvas.width/2, 380, "bold 26px Courier New", "#00f3ff");
            drawTextWithShadow("Polaroids Pinned: " + chickenEscapes, canvas.width/2, 420, "bold 18px Courier New", "#ffcc00");

            // Buttons
            ctx.fillStyle = '#25D366'; ctx.fillRect(45, 500, 160, 55); // WA
            ctx.fillStyle = '#E1306C'; ctx.fillRect(245, 500, 160, 55); // IG
            ctx.fillStyle = '#000000'; ctx.fillRect(45+4, 500+4, 160, 55); ctx.fillRect(245+4, 500+4, 160, 55); // Button shadows
            ctx.fillStyle = '#25D366'; ctx.fillRect(45, 500, 160, 55); ctx.fillStyle = '#E1306C'; ctx.fillRect(245, 500, 160, 55); 
            
            ctx.fillStyle = 'white'; ctx.font = "bold 18px Courier New";
            ctx.fillText("WA Status", 125, 535); ctx.fillText("IG Story", 325, 535);
            
            let alpha = Math.abs(Math.sin(frames * 0.05));
            ctx.fillStyle = `rgba(0, 243, 255, ${alpha})`; ctx.font = "bold 16px Courier New";
            ctx.fillText("Tap anywhere to Rejoin", canvas.width/2, 630);
            ctx.textAlign = "left"; 
        }
    }

    function loop() {
        ctx.save();
        if (screenShake > 0 && currentGameState === 'GAMEOVER') {
            let dx = (Math.random() - 0.5) * 25; let dy = (Math.random() - 0.5) * 25;
            ctx.translate(dx, dy); screenShake--;
        }

        drawBackgroundParallax();

        if (currentGameState === 'PLAYING') {
            player.update(); collectibles.update(); meetings.update();
        }
        
        if (currentGameState === 'PLAYING' || currentGameState === 'GAMEOVER') {
            meetings.draw(); collectibles.draw(); player.draw(); updateAndDrawParticles();
        }
        
        ctx.restore(); 
        drawUI(); frames++; requestAnimationFrame(loop);
    }

    // --- INPUT HANDLING ---
    const handleInput = (e) => {
        if(e) e.preventDefault(); 
        if (currentGameState === 'START') currentGameState = 'PLAYING';
        else if (currentGameState === 'PLAYING') player.fly();
        else if (currentGameState === 'GAMEOVER' && screenShake <= 0) resetGame();
    };

    canvas.addEventListener('mousedown', handleInput);
    canvas.addEventListener('touchstart', handleInput, {passive: false});
    document.addEventListener('keydown', function(e) { if(e.code === 'Space') handleInput(); });

    loop();
</script>
</body>
</html>
